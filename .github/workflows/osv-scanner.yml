name: OSV-Scanner

# OSV-Scanner remains available on demand, but scheduled execution is disabled
# in this fork to prevent unsolicited GitHub-hosted runners and notification noise.
on:
  workflow_dispatch:

permissions: {}

jobs:
  scan-scheduled:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    permissions:
      contents: read
      security-events: write
    with:
      # Advisory-first: surface results in code scanning without blocking.
      fail-on-vuln: false